<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc">
<title id="title">Intel 8085 40-pin DIP pin diagram</title>
<desc id="desc">A labelled 40-pin dual in-line package pin diagram for the Intel 8085 microprocessor.</desc>
<rect width="1400" height="1050" fill="#ffffff"/>
<style>
.title{font:700 34px Arial,sans-serif;fill:#102a43}
.sub{font:20px Arial,sans-serif;fill:#334e68}
.chip{fill:#eaf2f8;stroke:#1769aa;stroke-width:4}
.pin{stroke:#334e68;stroke-width:5;stroke-linecap:round}
.num{font:16px Arial,sans-serif;fill:#627d98}
.lab{font:700 20px Arial,sans-serif;fill:#102a43}
.note{font:17px Arial,sans-serif;fill:#486581}
</style>
<text x="700" y="55" text-anchor="middle" class="title">8085 Microprocessor — 40-pin DIP Pin Diagram</text>
<text x="700" y="88" text-anchor="middle" class="sub">Top view • notch at the top • pin numbers shown</text>
<rect x="520" y="125" width="360" height="800" rx="22" class="chip"/>
<path d="M640 125 Q700 205 760 125" fill="#ffffff" stroke="#1769aa" stroke-width="4"/>
<text x="700" y="500" text-anchor="middle" class="title" style="font-size:48px">8085</text>
<text x="700" y="540" text-anchor="middle" class="sub">8-bit CPU</text>
