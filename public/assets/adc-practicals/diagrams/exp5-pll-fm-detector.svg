<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><rect width="1200" height="560" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.h{font-size:30px;font-weight:bold}.t{font-size:22px}.s{font-size:18px}.b{fill:#eef7fa;stroke:#176b87;stroke-width:3}.w{fill:none;stroke:#263746;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="55" class="h">PLL FM detector block diagram</text><text x="55" y="205" class="t">FM input</text><path d="M150 195 H255" class="w"/><rect x="255" y="145" width="190" height="100" rx="12" class="b"/><text x="350" y="185" text-anchor="middle" class="t">Phase</text><text x="350" y="215" text-anchor="middle" class="t">comparator</text><path d="M445 195 H535" class="w"/><rect x="535" y="145" width="170" height="100" rx="12" class="b"/><text x="620" y="185" text-anchor="middle" class="t">Loop low-pass</text><text x="620" y="215" text-anchor="middle" class="t">filter</text><path d="M705 195 H795" class="w"/><rect x="795" y="145" width="150" height="100" rx="12" class="b"/><text x="870" y="185" text-anchor="middle" class="t">VCO</text><text x="870" y="215" text-anchor="middle" class="s">feedback source</text><path d="M945 195 H1030" class="w"/><rect x="1030" y="145" width="135" height="100" rx="12" class="b"/><text x="1097" y="185" text-anchor="middle" class="t">Buffer</text><text x="1097" y="215" text-anchor="middle" class="t">amp</text><path d="M1097 245 V315 H1145" class="w"/><text x="1145" y="350" text-anchor="end" class="t">Demodulated</text><text x="1145" y="380" text-anchor="end" class="t">audio output</text><path d="M870 245 V405 H350 V245" class="w"/><text x="610" y="445" text-anchor="middle" class="s">VCO output is fed back to the phase comparator</text><text x="55" y="510" class="s">The loop-filter control voltage follows the incoming FM frequency variation and recovers the message.</text></svg>