 d="M650 380 H570" class="w"/><rect x="390" y="330" width="180" height="100" rx="10" class="b"/><text x="480" y="370" text-anchor="middle" class="t">Sample &amp;</text><text x="480" y="400" text-anchor="middle" class="t">hold + LPF</text><path d="M390 380 H300" class="w"/><text x="290" y="370" text-anchor="end" class="t">Analogue</text><text x="290" y="400" text-anchor="end" class="t">output</text><text x="50" y="535" class="s">Transmitter: sampling → quantisation/encoding → serial transmission.</text><text x="50" y="570" class="s">Receiver: serial-to-parallel conversion → decoding/DAC → reconstruction filter.</text></svg>