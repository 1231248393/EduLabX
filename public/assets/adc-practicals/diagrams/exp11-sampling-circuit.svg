<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#172b3a}.h{font-size:30px;font-weight:bold}.t{font-size:22px}.b{fill:#eef7fa;stroke:#176b87;stroke-width:3}.w{fill:none;stroke:#263746;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="50" y="55" class="h">Sample-and-hold circuit block diagram</text><text x="55" y="210" class="t">Input signal</text><path d="M190 200 H270" class="w"/><rect x="270" y="150" width="170" height="100" rx="10" class="b"/><text x="355" y="190" text-anchor="middle" class="t">Input</text><text x="355" y="220" text-anchor="middle" class="t">buffer</text><path d="M440 200 H520" class="w"/><rect x="520" y="150" width="150" height="100" rx="10" class="b"/><text x="595" y="190" text-anchor="middle" class="t">Switch</text><text x="595" y="220" text-anchor="middle" class="t">(sample)</text><path d="M670 200 H750" class="w"/><circle cx="750" cy="200" r="6" fill="#176b87"/><path d="M750 200 V290 M720 290 H780 M720 310 H780 M750 310 V340" class="w"/><text x="805" y="305" class="t">Hold capacitor</text><path d="M750 200 H850" class="w"/><rect x="850" y="150" width="170" height="100" rx="10" class="b"/><text x="935" y="190" text-anchor="middle" class="t">Output</text><text x="935" y="220" text-anchor="middle" class="t">buffer</text><path d="M1020 200 H1110" class="w"/><text x="1115" y="180" class="t">Output</text><text x="1115" y="210" class="t">signal</text><text x="55" y="390" class="t">Control pulse opens/closes the switch to alternate between sample and hold intervals.</text></svg>