<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<title>8051 Microcontroller — Functional Block Diagram</title><rect width="100%" height="100%" fill="#ffffff"/>
<style>
.t{font-family:Arial,sans-serif;fill:#102a43} .h{font-size:27px;font-weight:bold} .b{font-size:20px;font-weight:bold} .s{font-size:16px} .box{fill:#eef6ff;stroke:#1769aa;stroke-width:3;rx:14} .line{stroke:#1769aa;stroke-width:3;fill:none} .sub{fill:#f4f7fa;stroke:#64748b;stroke-width:2;rx:10}
</style><text x="550" y="45" text-anchor="middle" class="t h">8051 Microcontroller — Functional Block Diagram</text><rect x="390" y="100" width="320" height="455" class="box"/><text x="550" y="140" text-anchor="middle" class="t h">8051 MCU</text>
<rect x="435" y="165" width="230" height="65" class="sub"/><text x="550" y="205" text-anchor="middle" class="t b">8-bit CPU / ALU</text>
<rect x="435" y="245" width="230" height="55" class="sub"/><text x="550" y="280" text-anchor="middle" class="t b">Registers / SFRs</text>
<rect x="435" y="315" width="105" height="65" class="sub"/><text x="487" y="355" text-anchor="middle" class="t b">RAM</text>
<rect x="560" y="315" width="105" height="65" class="sub"/><text x="612" y="355" text-anchor="middle" class="t b">ROM</text>
<rect x="435" y="395" width="230" height="55" class="sub"/><text x="550" y="430" text-anchor="middle" class="t b">Timers / Interrupts</text>
<rect x="435" y="465" width="230" height="55" class="sub"/><text x="550" y="500" text-anchor="middle" class="t b">Serial Port / Oscillator</text>
<rect x="35" y="210" width="240" height="125" class="sub"/><text x="155" y="255" text-anchor="middle" class="t b">4 × 8-bit I/O Ports</text><text x="155" y="285" text-anchor="middle" class="t s">P0, P1, P2, P3</text>
<rect x="825" y="210" width="240" height="125" class="sub"/><text x="945" y="255" text-anchor="middle" class="t b">External Interface</text><text x="945" y="285" text-anchor="middle" class="t s">Sensors / Displays</text>
<path d="M390 270 H275 M710 270 H825" class="line"/>
<text x="550" y="605" text-anchor="middle" class="t s">Conceptual standard 8051 architecture; exact trainer variant must be verified from its IC marking.</text></svg>