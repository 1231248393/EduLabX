<svg xmlns="http://www.w3.org/2000/svg" width="900" height="734" viewBox="0 0 900 734" role="img" aria-labelledby="title desc">
<title id="title">8-bit Multiplication — Repetitive Addition</title><desc id="desc">Step-by-step program flowchart.</desc>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="450.0" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">8-bit Multiplication — Repetitive Addition</text>
<rect x="125" y="90" width="650" height="64" rx="14" fill="#e0f2fe" stroke="#0b5c9e" stroke-width="2"/>
<text x="450.0" y="127.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Start: initialize A = 00H, C = 02H and B = 03H</text>
<path d="M 450.0 154 V 180 M 442.0 171 L 450.0 180 L 458.0 171" fill="none" stroke="#0b5c9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="125" y="188" width="650" height="64" rx="14" fill="#e0f2fe" stroke="#0b5c9e" stroke-width="2"/>
<text x="450.0" y="225.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Add C to accumulator A</text>
<path d="M 450.0 252 V 278 M 442.0 269 L 450.0 278 L 458.0 269" fill="none" stroke="#0b5c9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="125" y="286" width="650" height="64" rx="14" fill="#e0f2fe" stroke="#0b5c9e" stroke-width="2"/>
<text x="450.0" y="323.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Decrement repetition counter B</text>
<path d="M 450.0 350 V 376 M 442.0 367 L 450.0 376 L 458.0 367" fill="none" stroke="#0b5c9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="125" y="384" width="650" height="64" rx="14" fill="#e0f2fe" stroke="#0b5c9e" stroke-width="2"/>
<text x="450.0" y="421.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Is B zero? If NO, repeat ADD C</text>
<path d="M 450.0 448 V 474 M 442.0 465 L 450.0 474 L 458.0 465" fill="none" stroke="#0b5c9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="125" y="482" width="650" height="64" rx="14" fill="#e0f2fe" stroke="#0b5c9e" stroke-width="2"/>
<text x="450.0" y="519.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">If YES, store A at memory location 8020H</text>
<path d="M 450.0 546 V 572 M 442.0 563 L 450.0 572 L 458.0 563" fill="none" stroke="#0b5c9e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="125" y="580" width="650" height="64" rx="14" fill="#e0f2fe" stroke="#0b5c9e" stroke-width="2"/>
<text x="450.0" y="617.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0f172a">Expected product: 06H; execute HLT</text>
</svg>